name: Build Reader
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台（当前先验收 macOS）
        type: choice
        default: macos
        options: [macos, all, android, ios]
permissions:
  contents: read
concurrency:
  group: reader-${{ github.ref }}-${{ inputs.platform || 'macos' }}
  cancel-in-progress: true
env:
  PUB_HOSTED_URL: https://pub.dev
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Flutter 3.44.4
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-ui-checks
          path: build/qa/
          if-no-files-found: ignore
  android:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android') }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter and pinned Android tools
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: reader-test-signing-v1
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-tree-shake-icons --no-pub --build-number=${{ github.run_number }}
      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Reader-Android.apk
          sha256sum dist/Reader-Android.apk > dist/Reader-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reader-android
          path: dist/
          compression-level: 0
  macos:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    needs: validate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Flutter 3.44.4
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --no-tree-shake-icons --no-pub --build-number=${{ github.run_number }}
      - name: Verify native window geometry
        run: |
          xcrun swiftc -swift-version 5 macos/Runner/WindowResizeGeometry.swift tool/window_geometry_tests/main.swift -o "$RUNNER_TEMP/reader-window-tests"
          "$RUNNER_TEMP/reader-window-tests"
      - name: Package universal macOS app
        run: bash tool/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reader-macos
          path: dist/
          compression-level: 0
  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    needs: validate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Flutter 3.44.4
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --no-tree-shake-icons --no-pub --build-number=${{ github.run_number }}
      - name: Package unsigned iOS app
        run: |
          mkdir -p dist "$RUNNER_TEMP/reader-ios/Payload"
          ditto build/ios/iphoneos/Runner.app "$RUNNER_TEMP/reader-ios/Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/reader-ios/Payload" dist/Reader-iOS-unsigned.ipa
          shasum -a 256 dist/Reader-iOS-unsigned.ipa > dist/Reader-iOS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reader-ios
          path: dist/
          compression-level: 0
  release:
    needs: [validate, android, macos, ios]
    if: >-
      ${{ always() && !cancelled() && needs.validate.result == 'success' &&
          (needs.android.result == 'success' || needs.android.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
          (needs.android.result == 'success' || needs.macos.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.android.result == 'success' }}
        with:
          pattern: reader-android
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ needs.macos.result == 'success' }}
        with:
          pattern: reader-macos
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ needs.ios.result == 'success' }}
        with:
          pattern: reader-ios
          path: dist
          merge-multiple: true
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PLATFORM: ${{ inputs.platform || 'macos' }}
        run: |
          release_tag="preview-$BUILD_PLATFORM"
          if [ "$BUILD_PLATFORM" = all ]; then release_tag=preview; fi
          gh release view "$release_tag" >/dev/null 2>&1 || gh release create "$release_tag" --prerelease --target "$GITHUB_SHA" --title "Reader $BUILD_PLATFORM 测试版" --notes-file tool/release-notes.md
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" -f sha="$GITHUB_SHA" -F force=true
          gh release edit "$release_tag" --target "$GITHUB_SHA" --title "Reader $BUILD_PLATFORM 测试版 · Build $GITHUB_RUN_NUMBER" --notes-file tool/release-notes.md
          gh release upload "$release_tag" dist/* --clobber
